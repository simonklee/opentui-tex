name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (required for a real publish)
        type: string
        required: false
      dry-run:
        description: Validate packages without publishing
        type: boolean
        default: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  # setup-zig includes the job ID in its cache key; match CI to reuse native builds.
  native-packages:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.release.tag_name || inputs.tag) && format('refs/tags/{0}', github.event.release.tag_name || inputs.tag) || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - run: npm install --global npm@11.19.0
      - name: Validate release tag
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          if [[ "$DRY_RUN" != true && -z "$RELEASE_TAG" ]]; then
            echo "::error::A real publish requires an existing version tag"
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            version=$(bun -p 'require("./package.json").version')
            if [[ "$RELEASE_TAG" != "v$version" ]]; then
              echo "::error::Release tag must match v$version"
              exit 1
            fi
            test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          fi
      - run: bun install --frozen-lockfile
      - run: bun run release:check
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: release/*.tgz
          if-no-files-found: error
          overwrite: true

  publish:
    if: ${{ github.event_name == 'release' || !inputs.dry-run }}
    needs: native-packages
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', github.event.release.tag_name || inputs.tag) }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          registry-url: https://registry.npmjs.org/
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-packages
          path: release
      - name: Publish tested tarballs
        run: bun run publish:packages
        env:
          NPM_CONFIG_PROVENANCE: "true"
      - name: Attach tested tarballs
        if: ${{ github.event_name == 'release' }}
        run: gh release upload "$RELEASE_TAG" release/*.tgz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
