name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:package
      - run: bun run build:loader

  native-tests:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: bun install --frozen-lockfile
      - run: bun run test:native

  native-packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu.2.17
            package: opentui-tex-native-linux-x64
          - target: aarch64-linux-gnu.2.17
            package: opentui-tex-native-linux-arm64
          - target: x86_64-linux-musl
            package: opentui-tex-native-linux-x64-musl
          - target: aarch64-linux-musl
            package: opentui-tex-native-linux-arm64-musl
          - target: x86_64-macos.13.0
            package: opentui-tex-native-darwin-x64
          - target: aarch64-macos.13.0
            package: opentui-tex-native-darwin-arm64
          - target: x86_64-windows-gnu
            package: opentui-tex-native-win32-x64
          - target: aarch64-windows-gnu
            package: opentui-tex-native-win32-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: bun install --frozen-lockfile
      - run: bash scripts/build-native --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: node_modules/@simonklee/${{ matrix.package }}
          if-no-files-found: error
