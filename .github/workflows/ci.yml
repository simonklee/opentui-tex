name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:package

  native-tests:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: bun install --frozen-lockfile
      - run: bun run test:native

  native-packages:
    name: Release packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: bun install --frozen-lockfile
      - run: bun run build:release
      - run: bun run test:release
      - run: bun run publish:packages --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: release/*.tgz
          if-no-files-found: error
